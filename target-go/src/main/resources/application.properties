# Database
spring.datasource.url=jdbc:mysql://localhost:3306/targetgo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Server
server.port=8080

# JWT
jwt.secret=mySuperSecretKeyForTargetGo2026ChangeInProduction!
jwt.expiration=86400000

# Fix circular dependency (JwtFilter <-> SecurityConfig)
spring.main.allow-circular-references=true